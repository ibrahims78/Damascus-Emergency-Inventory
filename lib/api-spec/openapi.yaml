    DashboardStats:
      type: object
      required:
        - totalItems
        - belowMinCount
        - nearExpiryCount
        - expiredCount
        - zeroStockCount
        - totalEquipment
        - equipmentAlertCount
        - monthlyIn
        - monthlyOut
        - expiryAlertDays
        - recentTransactions
      properties:
        totalItems:
          type: integer
          description: Active items in the warehouse
        belowMinCount:
          type: integer
          description: Active items with currentStock < minStock (minStock > 0, excludes zero-stock items counted separately)
        nearExpiryCount:
          type: integer
          description: Active items expiring within expiryAlertDays, not yet expired
        expiredCount:
          type: integer
          description: Active items whose expiryDate <= today
        zeroStockCount:
          type: integer
          description: Active items with currentStock = 0
        totalEquipment:
          type: integer
          description: Equipment count excluding consumed/scrapped units
        equipmentAlertCount:
          type: integer
          description: Equipment in maintenance, needs_inspection, or broken state
        monthlyIn:
          type: integer
          description: IN transactions this calendar month
        monthlyOut:
          type: integer
          description: OUT transactions this calendar month
        prevMonthIn:
          type: integer
          description: IN transactions previous calendar month
        prevMonthOut:
          type: integer
          description: OUT transactions previous calendar month
        expiryAlertDays:
          type: integer
          description: Alert window in days (from system settings, default 30)
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/RecentTransaction"

